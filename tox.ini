# $ make data
# $ env GEOGRAPHICLIB_DATA="$(pwd)/data" tox run
[tox]
minversion = 4.50.3
# requires =
#     tox >=4
#     tox-uv >=1
env_list =
    py311
    py312
    py313
    py314
    py314t
    py315
    py315t
    coverage
    codestyle
    docs
isolated_build = True

[testenv]
description = run the tests with pytest
package = wheel
changedir = {envtmpdir}
dependency_groups =
    test
setenv =
    GEOGRAPHICLIB_DATA = {package_root}/data
commands =
    python3 -m geomodels install-data -d {package_root}/data recommended
    python3 -m pytest --doctest-modules {tty:--color=yes} -W error {posargs} {package_root}/tests

[testenv:py314t]
basepython = python3.14t

[testenv:py315t]
basepython = python3.15t

[testenv:coverage]
description = run coverage
dependency_groups =
    coverage
changedir = {envtmpdir}
setenv =
    GEOGRAPHICLIB_DATA = {package_root}/data
commands =
    python3 -m geomodels install-data -d {package_root}/data recommended
    python3 -m pytest {tty:--color=yes} --cov geomodels --cov-report=html --cov-report=term {package_root}/tests

[testenv:codestyle]
description = run linting
allowlist_externals = ruff
skip_install = true
dependency_groups =
    lint
changedir = {package_root}
commands =
    python3 -m flake8 --count --statistics geomodels
    python3 -m pydocstyle --count geomodels
    python3 -m isort --check geomodels
    python3 -m black --check geomodels
    # python3 -m mypy --check-untyped-defs --ignore-missing-imports geomodels
    # ruff check geomodels

[testenv:docs]
description = build docs
allowlist_externals = mkdir
changedir = docs
dependency_groups =
    docs
commands =
    mkdir -p _static
    python3 -m sphinx -W -b html . _build/html
    python3 -m sphinx -W -b doctest . _build/doctest
    python3 -m sphinx -W -b linkcheck . _build/linkcheck
    python3 -m sphinx -W -b spelling . _build/spelling
